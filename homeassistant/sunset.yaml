# Project Sunset: alerts for frames reaching the NAS, the cameras' health, the NAS itself and the
# CM4's UPS, and a notification when the evening's sunset is worth posting. Install steps are in docs/setup.md.
# This reads the NAS directly, so it still works if a Pi is dead.
#
# Conventions: one sensor per camera for each check; an unknown value (share unreadable, script
# failed, no result yet) counts as bad, never as fine; the first notification waits (delay_on) so a
# Home Assistant restart doesn't set anything off.
# Needs the python3 that Home Assistant's own container has (the JSON scripts call it).

command_line:
  # ---- Frame age (the first check): the newest JPEG's name on the NAS ----
  # The CM4 (hostname sunshine), saving as cm4wide. The Pi 3 `timelaps` (`wide`) was retired on
  # 2026-11-17 and its checks removed on 2026-11-20.
  - sensor:
      name: Sunset CM4 newest frame age
      unique_id: sunset_cm4_newest_frame_age
      command: "sh /config/sunset/sunset_frame_age.sh cm4wide"
      unit_of_measurement: min
      scan_interval: 300
      command_timeout: 30
  # The CM4's second camera (CAM1, 6 mm, from 2026-11-17), saving as cm4city.
  - sensor:
      name: Sunset cm4city newest frame age
      unique_id: sunset_cm4city_newest_frame_age
      command: "sh /config/sunset/sunset_frame_age.sh cm4city"
      unit_of_measurement: min
      scan_interval: 300
      command_timeout: 30

  # ---- Free space on the NAS share (issue #7) ----
  - sensor:
      name: Sunset NAS free space
      unique_id: sunset_nas_free_space
      command: "sh /config/sunset/sunset_nas_free.sh"
      unit_of_measurement: GB
      scan_interval: 900
      command_timeout: 30

  # ---- Camera health from the newest frame's JSON (issue #22): "ok", or what is wrong ----
  # Limits (undervoltage and throttle bits 0-3, 75 C, 150 files waiting on the Pi, 80% disk, 400 kB JPEG)
  # are defaults at the top of sunset_camera_health.sh. To change one for a camera, put it before
  # the command, for example: command: "OUTBOX_MAX=200 sh /config/sunset/sunset_camera_health.sh cm4wide"
  - sensor:
      name: Sunset CM4 camera health
      unique_id: sunset_cm4_camera_health
      command: "sh /config/sunset/sunset_camera_health.sh cm4wide"
      scan_interval: 300
      command_timeout: 30
  - sensor:
      name: Sunset cm4city camera health
      unique_id: sunset_cm4city_camera_health
      command: "sh /config/sunset/sunset_camera_health.sh cm4city"
      scan_interval: 300
      command_timeout: 30

  # ---- The CM4's UPS (issue #29), from the newest cm4wide frame: "mains 100", "battery 87", "unknown ..." ----
  # The state is that line (the alert reads it); every reading is an attribute, and the template
  # sensors below turn them into numbers Home Assistant graphs and keeps statistics for.
  - sensor:
      name: Sunset UPS
      unique_id: sunset_ups
      command: "sh /config/sunset/sunset_ups.sh cm4wide --json"
      value_template: "{{ value_json.state }}"
      json_attributes: [power, charge_pct, input_v, output_v, pack_v, cell1_v, cell2_v, cell3_v, cell1_c, cell2_c, cell3_c, cpu_temp_c]
      scan_interval: 120
      command_timeout: 30

  # ---- The evening's sky score (2026-11-22): pi/sunset-sky.py scores each sunset about 40 minutes
  # after it and writes it to the share; the automation at the end notifies when it is worth posting ----
  - sensor:
      name: Sunset sky score
      unique_id: sunset_sky_score
      command: "sh /config/sunset/sunset_sky.sh cm4wide"
      value_template: "{{ value_json.state }}"
      json_attributes: [date, label, sunset_utc, frames_scored, warm_sky_percent, best_frame]
      scan_interval: 600
      command_timeout: 30

input_number:
  sunset_max_frame_age:
    name: Sunset max frame age
    icon: mdi:timer-alert-outline
    unit_of_measurement: min
    min: 1
    max: 1440
    step: 1
    initial: 60 # Also restores this after a restart. Lower it briefly to test the alert.
    mode: box
  sunset_min_free_gb:
    name: Sunset min free space
    icon: mdi:harddisk
    unit_of_measurement: GB
    min: 0
    max: 20000
    step: 10
    # About a month of runway. With no DNGs (since 2026-11-16, issue #38) both cameras together use
    # about 3 GB a day: 0.76 GB in the 8 hours after 09:15 UTC Nov 16, plus the dense and bracket frames
    # around sunset. 100 GB is about 30 days: time to clear space or add a disk before frames back up on
    # the Pis. Was 350 (14 days at 25 GB a day) while the DNGs were kept. Raise it if the daily rate goes
    # up (a third camera). Other data on the share uses the same space.
    initial: 100
    mode: box

  # A sunset scoring this or more is worth posting (Steven, 2026-11-16: 60). The score is provisional,
  # tuned on few good sunsets, so expect to change this.
  sunset_sky_post_threshold:
    name: Sunset sky score to post
    icon: mdi:weather-sunset
    min: 1
    max: 100
    step: 1
    initial: 60
    mode: box

# The date of the last good-sunset notification, so an evening is announced once, not again after a
# restart. No initial: Home Assistant restores it.
input_text:
  sunset_sky_notified_date:
    name: Sunset sky notified date
    max: 10

template:
  - binary_sensor:
      - name: Sunset CM4 frames stale
        unique_id: sunset_cm4_frames_stale
        device_class: problem
        # An unknown age counts as stale, because the share being unreadable is also a failure.
        # The delay keeps a Home Assistant restart from setting it off.
        delay_on: "00:10:00"
        state: >
          {% set age = states('sensor.sunset_cm4_newest_frame_age') %}
          {{ not is_number(age) or age | float > states('input_number.sunset_max_frame_age') | float(60) }}
      - name: Sunset cm4city frames stale
        unique_id: sunset_cm4city_frames_stale
        device_class: problem
        delay_on: "00:10:00"
        state: >
          {% set age = states('sensor.sunset_cm4city_newest_frame_age') %}
          {{ not is_number(age) or age | float > states('input_number.sunset_max_frame_age') | float(60) }}

      - name: Sunset NAS space low
        unique_id: sunset_nas_space_low
        device_class: problem
        delay_on: "00:30:00"
        # Unknown counts as low: an unreadable share is the same emergency as a full one.
        state: >
          {% set free = states('sensor.sunset_nas_free_space') %}
          {{ not is_number(free) or free | float < states('input_number.sunset_min_free_gb') | float(100) }}

      # Anything but exactly "ok" is bad, which includes unknown and unavailable.
      # The 30 minutes let a brief throttle flag (soft temperature limit on a sunny afternoon) pass.
      - name: Sunset CM4 camera unhealthy
        unique_id: sunset_cm4_camera_unhealthy
        device_class: problem
        delay_on: "00:30:00"
        state: "{{ states('sensor.sunset_cm4_camera_health') != 'ok' }}"
      - name: Sunset cm4city camera unhealthy
        unique_id: sunset_cm4city_camera_unhealthy
        device_class: problem
        delay_on: "00:30:00"
        state: "{{ states('sensor.sunset_cm4city_camera_health') != 'ok' }}"

      # Anything but "mains" is bad: on the cells, or a UPS status that is stale or missing. A power cut
      # shows on the next frame, so this fires within about 5 to 10 minutes of it.
      - name: Sunset UPS on battery
        unique_id: sunset_ups_on_battery
        device_class: problem
        delay_on: "00:02:00"
        state: "{{ states('sensor.sunset_ups').split(' ')[0] != 'mains' }}"

  # The UPS readings as numbers, for graphs and long-term statistics. A reading the frame doesn't have
  # makes the sensor unavailable (a gap in the graph), never 0. Input voltage is the mains side: about
  # 15.2 V on mains, 0 on the cells. The board reports no current or run time on battery (#29).
  - sensor:
      - name: Sunset UPS charge
        unique_id: sunset_ups_charge
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: "{{ state_attr('sensor.sunset_ups', 'charge_pct') }}"
        availability: "{{ state_attr('sensor.sunset_ups', 'charge_pct') is number }}"
      - name: Sunset UPS input voltage
        unique_id: sunset_ups_input_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        state: "{{ state_attr('sensor.sunset_ups', 'input_v') }}"
        availability: "{{ state_attr('sensor.sunset_ups', 'input_v') is number }}"
      - name: Sunset UPS output voltage
        unique_id: sunset_ups_output_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        state: "{{ state_attr('sensor.sunset_ups', 'output_v') }}"
        availability: "{{ state_attr('sensor.sunset_ups', 'output_v') is number }}"
      - name: Sunset UPS pack voltage
        unique_id: sunset_ups_pack_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        state: "{{ state_attr('sensor.sunset_ups', 'pack_v') }}"
        availability: "{{ state_attr('sensor.sunset_ups', 'pack_v') is number }}"
      - name: Sunset UPS cell 1 voltage
        unique_id: sunset_ups_cell_1_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        state: "{{ state_attr('sensor.sunset_ups', 'cell1_v') }}"
        availability: "{{ state_attr('sensor.sunset_ups', 'cell1_v') is number }}"
      - name: Sunset UPS cell 2 voltage
        unique_id: sunset_ups_cell_2_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        state: "{{ state_attr('sensor.sunset_ups', 'cell2_v') }}"
        availability: "{{ state_attr('sensor.sunset_ups', 'cell2_v') is number }}"
      - name: Sunset UPS cell 3 voltage
        unique_id: sunset_ups_cell_3_voltage
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        state: "{{ state_attr('sensor.sunset_ups', 'cell3_v') }}"
        availability: "{{ state_attr('sensor.sunset_ups', 'cell3_v') is number }}"
      - name: Sunset UPS cell 1 temperature
        unique_id: sunset_ups_cell_1_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ state_attr('sensor.sunset_ups', 'cell1_c') }}"
        availability: "{{ state_attr('sensor.sunset_ups', 'cell1_c') is number }}"
      - name: Sunset UPS cell 2 temperature
        unique_id: sunset_ups_cell_2_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ state_attr('sensor.sunset_ups', 'cell2_c') }}"
        availability: "{{ state_attr('sensor.sunset_ups', 'cell2_c') is number }}"
      - name: Sunset UPS cell 3 temperature
        unique_id: sunset_ups_cell_3_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ state_attr('sensor.sunset_ups', 'cell3_c') }}"
        availability: "{{ state_attr('sensor.sunset_ups', 'cell3_c') is number }}"
      # The CM4's CPU temperature, from the same frame (System.cpu_temp_c), read by the UPS script.
      - name: Sunset CM4 CPU temperature
        unique_id: sunset_cm4_cpu_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ state_attr('sensor.sunset_ups', 'cpu_temp_c') }}"
        availability: "{{ state_attr('sensor.sunset_ups', 'cpu_temp_c') is number }}"

alert:
  sunset_cm4_frames_stale:
    name: Project Sunset CM4 has no new frames
    entity_id: binary_sensor.sunset_cm4_frames_stale
    state: "on"
    repeat: 360
    can_acknowledge: true
    message: >
      {% set age = states('sensor.sunset_cm4_newest_frame_age') %}
      {% if is_number(age) %}The CM4's newest frame on the NAS is {{ age }} minutes old.
      {% else %}Home Assistant can't find a recent CM4 frame on the NAS: no frames in two days, the share is unreadable, or the newest frame is named in the future.{% endif %}
      Open the diag page on sunshine to see why.
    done_message: Project Sunset CM4 frames are reaching the NAS again.
    notifiers:
      - persistent_notification
      # Add your phone here so an alert reaches you overnight, for example:
      # - mobile_app_your_phone

  sunset_cm4city_frames_stale:
    name: Project Sunset CM4 city camera has no new frames
    entity_id: binary_sensor.sunset_cm4city_frames_stale
    state: "on"
    repeat: 360
    can_acknowledge: true
    message: >
      {% set age = states('sensor.sunset_cm4city_newest_frame_age') %}
      {% if is_number(age) %}The CM4's second camera (cm4city, 6 mm) has its newest frame on the NAS {{ age }} minutes old.
      {% else %}Home Assistant can't find a recent cm4city frame on the NAS: no frames in two days, the share is unreadable, or the newest frame is named in the future.{% endif %}
      Open the diag page on sunshine to see why.
    done_message: Project Sunset cm4city frames are reaching the NAS again.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

  sunset_nas_space_low:
    name: Project Sunset NAS is running out of space
    entity_id: binary_sensor.sunset_nas_space_low
    state: "on"
    repeat: 720
    can_acknowledge: true
    message: >
      {% set free = states('sensor.sunset_nas_free_space') %}
      {% if is_number(free) %}The NAS share has {{ free }} GB free, under the {{ states('input_number.sunset_min_free_gb') }} GB limit (about a month of frames).
      {% else %}Home Assistant can't read the free space on the NAS share.{% endif %}
      Clear space before the Pis' disks start filling.
    done_message: The NAS share has enough free space again.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

  sunset_cm4_camera_unhealthy:
    name: Project Sunset CM4 is unhealthy
    entity_id: binary_sensor.sunset_cm4_camera_unhealthy
    state: "on"
    repeat: 360
    can_acknowledge: true
    message: >
      The CM4 (sunshine), from its newest frame: {{ states('sensor.sunset_cm4_camera_health') }}.
      (undervoltage, throttled, temp, outbox, disk, small_jpeg, repeat_frame, no_meta. Unknown means no readable frame JSON.)
    done_message: The CM4 health check is clear.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

  sunset_cm4city_camera_unhealthy:
    name: Project Sunset CM4 city camera is unhealthy
    entity_id: binary_sensor.sunset_cm4city_camera_unhealthy
    state: "on"
    repeat: 360
    can_acknowledge: true
    message: >
      The CM4's second camera (cm4city), from its newest frame: {{ states('sensor.sunset_cm4city_camera_health') }}.
      (undervoltage, throttled, temp, outbox, disk, small_jpeg, repeat_frame, no_meta. Unknown means no readable frame JSON.)
    done_message: The cm4city health check is clear.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

  sunset_ups_on_battery:
    name: Project Sunset CM4 is on battery
    entity_id: binary_sensor.sunset_ups_on_battery
    state: "on"
    repeat: 60
    can_acknowledge: true
    message: >
      {% set ups = states('sensor.sunset_ups') %}
      {% if ups.startswith('battery') %}The CM4 (sunshine) lost mains power and is running on the UPS cells, {{ ups.split(' ')[1] if ' ' in ups else '?' }}% charge.
      At low battery the Pi pauses capture and waits for mains (issue #29).
      {% elif ups == 'unknown old_frame' %}Home Assistant can't tell whether the CM4 has power: the newest cm4wide frame is over an hour old, so its UPS reading is out of date. See the "no new frames" alert.
      {% elif ups in ['unknown', 'unavailable', ''] %}Home Assistant has no UPS reading yet: it may have just restarted (it reads a frame within 2 minutes), or no recent frame JSON is readable.
      {% else %}Home Assistant can't tell whether the CM4 is on mains: the UPS reads "{{ ups }}" (the UPS monitor's status is stale or missing).{% endif %}
    done_message: The CM4 is back on mains power.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

automation:
  # An acknowledged alert (state "idle") would otherwise stay silent for the whole outage. After 12 hours
  # of still being acknowledged, switch it back on, which sends the alert again and restarts its repeats.
  # Add this package's alerts to the list if you add more. The alert's own `alert.turn_on` does the reset.
  - id: sunset_unacknowledge_alerts
    alias: Project Sunset re-arm acknowledged alerts
    mode: parallel
    trigger:
      - platform: state
        entity_id:
          - alert.sunset_cm4_frames_stale
          - alert.sunset_cm4city_frames_stale
          - alert.sunset_nas_space_low
          - alert.sunset_cm4_camera_unhealthy
          - alert.sunset_cm4city_camera_unhealthy
          - alert.sunset_ups_on_battery
        to: "idle"
        for: "12:00:00"
    action:
      - service: alert.turn_on
        target:
          entity_id: "{{ trigger.entity_id }}"

  # A good sunset (2026-11-22): once an evening, when the sky score reaches the threshold and the
  # sunset was less than 12 hours ago (an old result after a restart says nothing about tonight).
  # Building and posting the video stay by hand (README: building a day's video).
  - id: sunset_good_sunset_notify
    alias: Project Sunset good sunset
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.sunset_sky_score
    condition:
      - condition: template
        value_template: >
          {% set score = states('sensor.sunset_sky_score') %}
          {% set day = state_attr('sensor.sunset_sky_score', 'date') %}
          {% set sunset = as_datetime(state_attr('sensor.sunset_sky_score', 'sunset_utc') or '') %}
          {{ is_number(score) and score | float >= states('input_number.sunset_sky_post_threshold') | float(60)
             and day is string and day != states('input_text.sunset_sky_notified_date')
             and sunset is not none and (now() - sunset).total_seconds() < 43200 }}
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.sunset_sky_notified_date
        data:
          value: "{{ state_attr('sensor.sunset_sky_score', 'date') }}"
      - service: persistent_notification.create
        data:
          notification_id: sunset_good_sunset
          title: "Good sunset: {{ states('sensor.sunset_sky_score') }}"
          message: >
            {{ state_attr('sensor.sunset_sky_score', 'date') }} scored {{ states('sensor.sunset_sky_score') }}
            ({{ state_attr('sensor.sunset_sky_score', 'label') }}), at or above
            {{ states('input_number.sunset_sky_post_threshold') | int(60) }}. Worth an Instagram post:
            build the video with tools/build_video.py for that date.
      # Add your phone here so it reaches you, for example:
      # - service: notify.mobile_app_your_phone
      #   data:
      #     title: "Good sunset: {{ states('sensor.sunset_sky_score') }}"
      #     message: "{{ state_attr('sensor.sunset_sky_score', 'date') }} is worth posting."
