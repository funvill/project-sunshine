# Project Sunset: alerts for frames reaching the NAS, the cameras' health, the NAS itself, the daily
# video job and the archive checks. Install steps are in docs/setup.md.
# This reads the NAS directly, so it still works if a Pi is dead.
#
# Conventions: one sensor per camera for each check; an unknown value (share unreadable, script
# failed, no result yet) counts as bad, never as fine; the first notification waits (delay_on) so a
# Home Assistant restart doesn't set anything off.
# Needs the python3 that Home Assistant's own container has (the JSON scripts call it).

command_line:
  # ---- Frame age (the first check): the newest JPEG's name on the NAS ----
  # The CM4 (hostname sunshine), saving as cm4wide. The Pi 3 `timelaps` (`wide`) was retired on
  # 2026-11-17 and its checks removed on 2026-11-20.
  - sensor:
      name: Sunset CM4 newest frame age
      unique_id: sunset_cm4_newest_frame_age
      command: "sh /config/sunset/sunset_frame_age.sh cm4wide"
      unit_of_measurement: min
      scan_interval: 300
      command_timeout: 30
  # The CM4's second camera (CAM1, 6 mm, from 2026-11-17), saving as cm4city.
  - sensor:
      name: Sunset cm4city newest frame age
      unique_id: sunset_cm4city_newest_frame_age
      command: "sh /config/sunset/sunset_frame_age.sh cm4city"
      unit_of_measurement: min
      scan_interval: 300
      command_timeout: 30

  # ---- Free space on the NAS share (issue #7) ----
  - sensor:
      name: Sunset NAS free space
      unique_id: sunset_nas_free_space
      command: "sh /config/sunset/sunset_nas_free.sh"
      unit_of_measurement: GB
      scan_interval: 900
      command_timeout: 30

  # ---- Camera health from the newest frame's JSON (issue #22): "ok", or what is wrong ----
  # Limits (undervoltage and throttle bits 0-3, 75 C, 50 frames waiting on the Pi, 80% disk, 400 kB JPEG)
  # are defaults at the top of sunset_camera_health.sh. To change one for a camera, put it before
  # the command, for example: command: "OUTBOX_MAX=100 sh /config/sunset/sunset_camera_health.sh cm4wide"
  - sensor:
      name: Sunset CM4 camera health
      unique_id: sunset_cm4_camera_health
      command: "sh /config/sunset/sunset_camera_health.sh cm4wide"
      scan_interval: 300
      command_timeout: 30
  - sensor:
      name: Sunset cm4city camera health
      unique_id: sunset_cm4city_camera_health
      command: "sh /config/sunset/sunset_camera_health.sh cm4city"
      scan_interval: 300
      command_timeout: 30

  # ---- The CM4's UPS (issue #29), from the newest cm4wide frame: "mains 100", "battery 87", "unknown ..." ----
  - sensor:
      name: Sunset UPS
      unique_id: sunset_ups
      command: "sh /config/sunset/sunset_ups.sh cm4wide"
      scan_interval: 120
      command_timeout: 30

  # ---- The daily video job: status and age of the newest daily/*.json ----
  # "<status> <date> <age>d". Only "ok" (status encoded) is good; skipped, failed, stale, unreadable
  # and any status this script doesn't know all count as bad.
  - sensor:
      name: Sunset daily video
      unique_id: sunset_daily_video
      command: "sh /config/sunset/sunset_daily_status.sh"
      scan_interval: 1800
      command_timeout: 30

  # ---- The archive verifier (nas/sunset-verify.py): hashes checked against the frame JSON ----
  # "ok", "bad missing=1 mismatched=2 ...", or "stale" if it hasn't run in 48 hours.
  - sensor:
      name: Sunset CM4 archive check
      unique_id: sunset_cm4_archive_check
      command: "sh /config/sunset/sunset_result.sh verify cm4wide 48"
      scan_interval: 1800
      command_timeout: 30

  # ---- The daily health record (nas/sunset-health.py): counts, gaps, missing blocks ----
  # "ok", or the record's problem names, or "stale" if no new record in 48 hours.
  - sensor:
      name: Sunset CM4 daily health
      unique_id: sunset_cm4_daily_health
      command: "sh /config/sunset/sunset_result.sh health cm4wide 48"
      scan_interval: 1800
      command_timeout: 30

input_number:
  sunset_max_frame_age:
    name: Sunset max frame age
    icon: mdi:timer-alert-outline
    unit_of_measurement: min
    min: 1
    max: 1440
    step: 1
    initial: 60 # Also restores this after a restart. Lower it briefly to test the alert.
    mode: box
  sunset_min_free_gb:
    name: Sunset min free space
    icon: mdi:harddisk
    unit_of_measurement: GB
    min: 0
    max: 20000
    step: 10
    # About a month of runway. With no DNGs (since 2026-11-16, issue #38) both cameras together use
    # about 3 GB a day: 0.76 GB in the 8 hours after 09:15 UTC Nov 16, plus the dense and bracket frames
    # around sunset. 100 GB is about 30 days: time to clear space or add a disk before frames back up on
    # the Pis. Was 350 (14 days at 25 GB a day) while the DNGs were kept. Raise it if the daily rate goes
    # up (DNGs back on, a third camera). Other data on the share uses the same space.
    initial: 100
    mode: box

template:
  - binary_sensor:
      - name: Sunset CM4 frames stale
        unique_id: sunset_cm4_frames_stale
        device_class: problem
        # An unknown age counts as stale, because the share being unreadable is also a failure.
        # The delay keeps a Home Assistant restart from setting it off.
        delay_on: "00:10:00"
        state: >
          {% set age = states('sensor.sunset_cm4_newest_frame_age') %}
          {{ not is_number(age) or age | float > states('input_number.sunset_max_frame_age') | float(60) }}
      - name: Sunset cm4city frames stale
        unique_id: sunset_cm4city_frames_stale
        device_class: problem
        delay_on: "00:10:00"
        state: >
          {% set age = states('sensor.sunset_cm4city_newest_frame_age') %}
          {{ not is_number(age) or age | float > states('input_number.sunset_max_frame_age') | float(60) }}

      - name: Sunset NAS space low
        unique_id: sunset_nas_space_low
        device_class: problem
        delay_on: "00:30:00"
        # Unknown counts as low: an unreadable share is the same emergency as a full one.
        state: >
          {% set free = states('sensor.sunset_nas_free_space') %}
          {{ not is_number(free) or free | float < states('input_number.sunset_min_free_gb') | float(100) }}

      # Anything but exactly "ok" is bad, which includes unknown and unavailable.
      # The 30 minutes let a brief throttle flag (soft temperature limit on a sunny afternoon) pass.
      - name: Sunset CM4 camera unhealthy
        unique_id: sunset_cm4_camera_unhealthy
        device_class: problem
        delay_on: "00:30:00"
        state: "{{ states('sensor.sunset_cm4_camera_health') != 'ok' }}"
      - name: Sunset cm4city camera unhealthy
        unique_id: sunset_cm4city_camera_unhealthy
        device_class: problem
        delay_on: "00:30:00"
        state: "{{ states('sensor.sunset_cm4city_camera_health') != 'ok' }}"

      # Anything but "mains" is bad: on the cells, or a UPS status that is stale or missing. A power cut
      # shows on the next frame, so this fires within about 5 to 10 minutes of it.
      - name: Sunset UPS on battery
        unique_id: sunset_ups_on_battery
        device_class: problem
        delay_on: "00:02:00"
        state: "{{ states('sensor.sunset_ups').split(' ')[0] != 'mains' }}"

      # The first word of the daily video state is the status.
      - name: Sunset daily video failed
        unique_id: sunset_daily_video_failed
        device_class: problem
        delay_on: "01:00:00"
        state: "{{ states('sensor.sunset_daily_video').split(' ')[0] != 'ok' }}"

      - name: Sunset CM4 archive check failed
        unique_id: sunset_cm4_archive_check_failed
        device_class: problem
        delay_on: "00:10:00"
        state: "{{ states('sensor.sunset_cm4_archive_check') != 'ok' }}"

      - name: Sunset CM4 daily health failed
        unique_id: sunset_cm4_daily_health_failed
        device_class: problem
        delay_on: "00:10:00"
        state: "{{ states('sensor.sunset_cm4_daily_health') != 'ok' }}"

alert:
  sunset_cm4_frames_stale:
    name: Project Sunset CM4 has no new frames
    entity_id: binary_sensor.sunset_cm4_frames_stale
    state: "on"
    repeat: 360
    can_acknowledge: true
    message: >
      {% set age = states('sensor.sunset_cm4_newest_frame_age') %}
      {% if is_number(age) %}The CM4's newest frame on the NAS is {{ age }} minutes old.
      {% else %}Home Assistant can't find a recent CM4 frame on the NAS: no frames in two days, the share is unreadable, or the newest frame is named in the future.{% endif %}
      Open the diag page on sunshine to see why.
    done_message: Project Sunset CM4 frames are reaching the NAS again.
    notifiers:
      - persistent_notification
      # Add your phone here so an alert reaches you overnight, for example:
      # - mobile_app_your_phone

  sunset_cm4city_frames_stale:
    name: Project Sunset CM4 city camera has no new frames
    entity_id: binary_sensor.sunset_cm4city_frames_stale
    state: "on"
    repeat: 360
    can_acknowledge: true
    message: >
      {% set age = states('sensor.sunset_cm4city_newest_frame_age') %}
      {% if is_number(age) %}The CM4's second camera (cm4city, 6 mm) has its newest frame on the NAS {{ age }} minutes old.
      {% else %}Home Assistant can't find a recent cm4city frame on the NAS: no frames in two days, the share is unreadable, or the newest frame is named in the future.{% endif %}
      Open the diag page on sunshine to see why.
    done_message: Project Sunset cm4city frames are reaching the NAS again.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

  sunset_nas_space_low:
    name: Project Sunset NAS is running out of space
    entity_id: binary_sensor.sunset_nas_space_low
    state: "on"
    repeat: 720
    can_acknowledge: true
    message: >
      {% set free = states('sensor.sunset_nas_free_space') %}
      {% if is_number(free) %}The NAS share has {{ free }} GB free, under the {{ states('input_number.sunset_min_free_gb') }} GB limit (about a month of frames).
      {% else %}Home Assistant can't read the free space on the NAS share.{% endif %}
      Clear space before the Pis' disks start filling.
    done_message: The NAS share has enough free space again.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

  sunset_cm4_camera_unhealthy:
    name: Project Sunset CM4 is unhealthy
    entity_id: binary_sensor.sunset_cm4_camera_unhealthy
    state: "on"
    repeat: 360
    can_acknowledge: true
    message: >
      The CM4 (sunshine), from its newest frame: {{ states('sensor.sunset_cm4_camera_health') }}.
      (undervoltage, throttled, temp, outbox, disk, small_jpeg, repeat_frame, no_meta. Unknown means no readable frame JSON.)
    done_message: The CM4 health check is clear.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

  sunset_cm4city_camera_unhealthy:
    name: Project Sunset CM4 city camera is unhealthy
    entity_id: binary_sensor.sunset_cm4city_camera_unhealthy
    state: "on"
    repeat: 360
    can_acknowledge: true
    message: >
      The CM4's second camera (cm4city), from its newest frame: {{ states('sensor.sunset_cm4city_camera_health') }}.
      (undervoltage, throttled, temp, outbox, disk, small_jpeg, repeat_frame, no_meta. Unknown means no readable frame JSON.)
    done_message: The cm4city health check is clear.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

  sunset_ups_on_battery:
    name: Project Sunset CM4 is on battery
    entity_id: binary_sensor.sunset_ups_on_battery
    state: "on"
    repeat: 60
    can_acknowledge: true
    message: >
      {% set ups = states('sensor.sunset_ups') %}
      {% if ups.startswith('battery') %}The CM4 (sunshine) lost mains power and is running on the UPS cells, {{ ups.split(' ')[1] if ' ' in ups else '?' }}% charge.
      At low battery the Pi pauses capture and waits for mains (issue #29).
      {% else %}Home Assistant can't tell whether the CM4 is on mains: the UPS reads "{{ ups }}" (no frame JSON, or the UPS monitor's status is stale).{% endif %}
    done_message: The CM4 is back on mains power.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

  sunset_daily_video_failed:
    name: Project Sunset daily video job is not succeeding
    entity_id: binary_sensor.sunset_daily_video_failed
    state: "on"
    repeat: 720
    can_acknowledge: true
    message: >
      The newest daily video record says: {{ states('sensor.sunset_daily_video') }}
      (status, date, age in days). Look at daily/ on the NAS and the job's log.
    done_message: The daily video job is succeeding again.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

  sunset_cm4_archive_check_failed:
    name: Project Sunset CM4 archive check found a problem
    entity_id: binary_sensor.sunset_cm4_archive_check_failed
    state: "on"
    repeat: 720
    can_acknowledge: true
    message: >
      The CM4's archive check says: {{ states('sensor.sunset_cm4_archive_check') }}.
      Paths are in health/cm4wide/verify.json on the NAS. Stale means the verifier has not run.
    done_message: The CM4's archive check is clear.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

  sunset_cm4_daily_health_failed:
    name: Project Sunset CM4 daily health record has problems
    entity_id: binary_sensor.sunset_cm4_daily_health_failed
    state: "on"
    repeat: 720
    can_acknowledge: true
    message: >
      The CM4's last full day: {{ states('sensor.sunset_cm4_daily_health') }}.
      Details are in health/cm4wide/latest.json on the NAS. Stale means no new record in 48 hours.
    done_message: The CM4's daily health record is clear.
    notifiers:
      - persistent_notification
      # - mobile_app_your_phone

automation:
  # An acknowledged alert (state "idle") would otherwise stay silent for the whole outage. After 12 hours
  # of still being acknowledged, switch it back on, which sends the alert again and restarts its repeats.
  # Add this package's alerts to the list if you add more. The alert's own `alert.turn_on` does the reset.
  - id: sunset_unacknowledge_alerts
    alias: Project Sunset re-arm acknowledged alerts
    mode: parallel
    trigger:
      - platform: state
        entity_id:
          - alert.sunset_cm4_frames_stale
          - alert.sunset_cm4city_frames_stale
          - alert.sunset_nas_space_low
          - alert.sunset_cm4_camera_unhealthy
          - alert.sunset_cm4city_camera_unhealthy
          - alert.sunset_ups_on_battery
          - alert.sunset_daily_video_failed
          - alert.sunset_cm4_archive_check_failed
          - alert.sunset_cm4_daily_health_failed
        to: "idle"
        for: "12:00:00"
    action:
      - service: alert.turn_on
        target:
          entity_id: "{{ trigger.entity_id }}"
